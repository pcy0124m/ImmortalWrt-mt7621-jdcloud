name: Build ImmortalWrt 25.12 for JDCloud RE-SP-01B

on:
  workflow_dispatch:        # 手动触发（仓库 Actions 页 → Run workflow）
  schedule:
    - cron: '0 2 * * 1'     # 每周一凌晨 2 点自动编译（不需要可删掉这段）

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-25.12
  CONFIG_FILE: config/re-sp-01b.config
  DIY_P1_SH: diy-part3.sh
  DIY_P2_SH: diy-part4.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 清理并安装依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /opt/ghc
          sudo apt-get -qq update
          sudo apt-get -qq install $(curl -fsSL https://github.com/281677160/Actions-OpenWrt/raw/main/depends-ubuntu-2204)
          sudo apt-get -qq autoremove --purge
          sudo timedatectl set-timezone "$TZ"

      - name: 克隆 ImmortalWrt 25.12 源码
        run: git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

      - name: 执行 diy-part1（更新 feeds 前）
        run: |
          cd openwrt
          [ -e $GITHUB_WORKSPACE/$DIY_P1_SH ] && bash $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行 diy-part2（生成配置前）
        run: |
          cd openwrt
          [ -e $GITHUB_WORKSPACE/$DIY_P2_SH ] && bash $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 载入配置
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
          make defconfig

      - name: 编译固件
        run: |
          cd openwrt
          # 关键：开启 pipefail，避免 make 失败被 tee 掩盖导致误报成功
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: RE-SP-01B-ImmortalWrt-25.12
          path: |
            openwrt/bin/targets/ramips/mt7621/*.bin
            openwrt/build.log
          if-no-files-found: error
          retention-days: 7
